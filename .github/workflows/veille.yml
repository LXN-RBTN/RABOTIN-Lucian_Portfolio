name: Veille hebdomadaire avec validation
on:
  schedule:
    # Lundi 08:00 en France, avec le fuseau Europe/Paris
    - cron: '0 8 * * 1'
      timezone: Europe/Paris
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: veille-hebdomadaire-publication
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer la dépendance
        run: python -m pip install feedparser==6.0.12
      - name: Vérifier la syntaxe
        run: python -m py_compile scripts/weekly_veille.py
      - name: Tester la publication dans un dossier temporaire
        run: python -m unittest discover -s tests -p 'test_veille.py' -v

  veille:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner && (github.event.comment.body == 'oui' || github.event.comment.body == 'non'))
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer la dépendance RSS
        run: python -m pip install feedparser==6.0.12

      - name: Générer les propositions du lundi
        if: github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_veille.py propose

      - name: Vérifier la syntaxe Python
        run: python -m py_compile scripts/weekly_veille.py

      - name: Traiter le vote du propriétaire
        id: moderation
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_COMMENT: ${{ github.event.comment.body }}
        run: python scripts/weekly_veille.py respond

      - name: Publier uniquement les fichiers effectivement modifiés
        if: steps.moderation.outputs.approved == 'true'
        run: |
          if git diff --quiet -- data/cyber-articles.json data/5g-6g-articles.json data/veille-publications.json veille-cyber.html veille-5g-6g.html && [ ! -f data/veille-publications.json ]; then
            echo "Aucune modification à publier"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cyber-articles.json data/5g-6g-articles.json veille-cyber.html veille-5g-6g.html
          if [ -f data/veille-publications.json ]; then git add data/veille-publications.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "veille: publier un article validé"
          git push origin HEAD:main

      - name: Préparer GitHub Pages
        if: steps.moderation.outputs.approved == 'true'
        uses: actions/configure-pages@v5

      - name: Préparer le site statique
        if: steps.moderation.outputs.approved == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer le site mis à jour
        if: steps.moderation.outputs.approved == 'true'
        uses: actions/deploy-pages@v4

      - name: Confirmer et fermer la proposition publiée
        if: steps.moderation.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "✅ Article ajouté au portfolio et publication GitHub déclenchée."

