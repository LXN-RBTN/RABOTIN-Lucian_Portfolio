name: Publication du portfolio

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/**'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer la version actuelle du site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
